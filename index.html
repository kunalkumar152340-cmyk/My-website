<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique Suppliers — Business Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root[data-theme="light"]{
  --bg:#f3f1e9; --panel:#ffffff; --panel-2:#faf8f2; --ink:#1c2430; --muted:#647082;
  --line:#e4ddc9; --steel:#2f4d6b; --steel-dk:#1b2430; --accent:#e2841f; --accent-ink:#3a2000;
  --danger:#b8382a; --success:#2f8f52; --warn:#b9821c; --lcd-bg:#1b2430; --lcd-fg:#f0a840;
  --shadow: 0 1px 2px rgba(28,36,48,.06), 0 6px 18px rgba(28,36,48,.06);
}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#181e28; --panel-2:#1d2430; --ink:#eef1f5; --muted:#8d99ac;
  --line:#2a3341; --steel:#4d7aa8; --steel-dk:#0d1116; --accent:#f0a04b; --accent-ink:#2a1600;
  --danger:#e0685a; --success:#4cc17c; --warn:#e2b64f; --lcd-bg:#0c0f14; --lcd-fg:#ffb454;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent);color:var(--accent-ink);}
a{color:inherit;}

/* ---------- LOGIN ---------- */
#loginScreen{
  --gold:#d4af37; --gold-bright:#f2cf6b; --gold-dim:#a9822a;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 18% 15%, rgba(212,175,55,.14), transparent 42%),
    radial-gradient(circle at 85% 85%, rgba(212,175,55,.09), transparent 48%),
    linear-gradient(160deg, #0a0a0a, #000000 55%);
  padding:20px;
}
.loginCard{
  width:100%;max-width:380px;background:linear-gradient(165deg,#141414,#0a0a0a);border-radius:14px;
  box-shadow:0 0 0 1px rgba(212,175,55,.35), 0 25px 70px rgba(0,0,0,.65), 0 0 40px rgba(212,175,55,.06);
  padding:34px 30px 28px; border:1px solid rgba(212,175,55,.5);
}
.loginCard .logoRow{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;}
.loginCard .logo-mark{background:linear-gradient(155deg,#1a1a1a,#000);border:1px solid rgba(212,175,55,.55);box-shadow:0 0 18px rgba(212,175,55,.18);}
.loginCard h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright);margin:2px 0 0;font-weight:700;text-shadow:0 0 12px rgba(212,175,55,.25);}
.loginCard p.sub{margin:0;font-size:12px;color:#a89b74;text-align:center;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:6px;}
.field input, .field select{
  width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid rgba(212,175,55,.3);
  background:#111111;color:#f2e9cf;font-size:14px;outline:none;transition:border-color .15s, box-shadow .15s;
}
.field input::placeholder{color:#6b624a;}
.field input:focus, .field select:focus{border-color:var(--gold-bright);box-shadow:0 0 0 3px rgba(212,175,55,.12);}
.btn{
  border:none;border-radius:8px;padding:11px 16px;font-weight:700;font-size:13.5px;
  letter-spacing:.02em; display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .06s, filter .15s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;padding:12px;font-size:14px;}
#loginScreen .btn-primary{background:linear-gradient(135deg,var(--gold-bright),var(--gold) 55%,var(--gold-dim));color:#161200;box-shadow:0 8px 20px rgba(212,175,55,.25);}
#loginScreen .btn-primary:hover{filter:brightness(1.08);}
#loginScreen .loginErr{color:#e0685a;}
#loginScreen .loginHint{background:#111111;border:1px dashed rgba(212,175,55,.35);color:#a89b74;}
#loginScreen .loginHint b{color:var(--gold-bright);}
#loginScreen .btn-primary:disabled{opacity:.7;cursor:default;}
.pwWrap{position:relative;}
.pwWrap input{padding-right:40px !important;}
.pwToggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#a89b74;border-radius:6px;
}
.pwToggle:hover{color:var(--gold-bright);}
.pwToggle svg{width:17px;height:17px;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--accent);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:transparent;color:var(--muted);padding:6px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
.loginErr{color:var(--danger);font-size:12.5px;text-align:center;margin-top:6px;min-height:16px;}
.loginHint{margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--panel-2);border:1px dashed var(--line);font-size:11.5px;color:var(--muted);text-align:center;}

/* ---------- LOGO ---------- */
.logo{display:flex;align-items:center;gap:10px;perspective:600px;}
.logo-mark{
  width:42px;height:42px;border-radius:10px;background:linear-gradient(155deg,var(--steel),var(--steel-dk));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.08);
  transform-style:preserve-3d;
  animation: logoTilt3d 6s ease-in-out infinite;
}
.logo-mark::before{
  content:'';position:absolute;inset:-3px;border-radius:13px;z-index:-1;
  background:conic-gradient(from 0deg, transparent 0 60%, var(--accent) 75%, transparent 90%);
  animation: logoRing 3.2s linear infinite; opacity:.75;
}
.logo-mark::after{
  content:'';position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:linear-gradient(115deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 30%);
  animation: logoSheen 6s ease-in-out infinite;
}
.logo-mark svg{width:26px;height:26px;position:relative;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
@keyframes logoTilt3d{
  0%,100%{ transform: rotateY(0deg) rotateX(0deg) translateZ(0); }
  25%{ transform: rotateY(22deg) rotateX(-8deg) translateZ(4px); }
  50%{ transform: rotateY(0deg) rotateX(8deg) translateZ(0); }
  75%{ transform: rotateY(-22deg) rotateX(-8deg) translateZ(4px); }
}
@keyframes logoRing{ to{ transform:rotate(360deg); } }
@keyframes logoSheen{
  0%,100%{ opacity:0; transform:translateX(-30%); }
  45%{ opacity:.9; }
  55%{ opacity:0; transform:translateX(30%); }
}
.loginCard .logo-mark{ animation: logoTilt3d 5s ease-in-out infinite, loginGlow 2.6s ease-in-out infinite; }
@keyframes loginGlow{
  0%,100%{ box-shadow:0 0 18px rgba(212,175,55,.18); }
  50%{ box-shadow:0 0 30px rgba(212,175,55,.4); }
}
.logo-text{display:flex;flex-direction:column;line-height:1.1;}
.logo-text b{font-size:15px;font-weight:800;letter-spacing:.01em;}
.logo-text span{font-size:9.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
@media (prefers-reduced-motion: reduce){
  .logo-mark, .logo-mark::before, .logo-mark::after{ animation:none !important; }
}
.bankCard{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;overflow:hidden;}
.bankCard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--steel),var(--accent));}
.bankCard .bName{font-weight:800;font-size:14px;margin-bottom:2px;}
.bankCard .bMeta{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
.bankCard .bBal{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;color:var(--steel);}
[data-theme="dark"] .bankCard .bBal{color:var(--accent);}
.bankCardGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px;}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;grid-template-columns:230px 1fr;}
#app.show{display:grid;}
.sidebar{
  background:var(--steel-dk);color:#e9edf2;padding:18px 12px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar .logo{padding:6px 8px 18px;}
.sidebar .logo-text b{color:#fff;}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7c8797;font-weight:700;margin:14px 8px 6px;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:600;
  color:#c7cfdb;cursor:pointer;transition:background .12s,color .12s;
}
.navitem svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
.navitem.active{background:var(--accent);color:var(--accent-ink);}
.navitem.active svg{opacity:1;}
.navbadge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px;}

.main{min-width:0;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
}
.topbar .pageTitle{font-size:16px;font-weight:800;margin-right:4px;white-space:nowrap;}
.searchWrap{position:relative;flex:1;max-width:420px;}
.searchWrap input{
  width:100%;padding:9px 12px 9px 34px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--panel-2);color:var(--ink);font-size:13.5px;outline:none;
}
.searchWrap input:focus{border-color:var(--accent);}
.searchWrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);}
.searchResults{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);max-height:340px;overflow-y:auto;display:none;z-index:50;
}
.searchResults.show{display:block;}
.searchResults .sr-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;}
.searchResults .sr-item:last-child{border-bottom:none;}
.searchResults .sr-item:hover{background:var(--panel-2);}
.searchResults .sr-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;}
.spacer{flex:1;}
.iconbtn{
  width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;
}
.iconbtn svg{width:17px;height:17px;}
.iconbtn:hover{border-color:var(--accent);}
.userchip{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;}
.userchip b{color:var(--ink);}

.content{padding:20px;}
.hidden{display:none !important;}

/* ---------- CARDS / KPI (LCD look) ---------- */
.kpiRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
.kpi{
  background:var(--lcd-bg);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.06); position:relative; overflow:hidden;
}
.kpi::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px, transparent 1px 6px);pointer-events:none;}
.kpi .kLabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8fa0b8;font-weight:700;margin-bottom:8px;}
.kpi .kVal{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:800;color:var(--lcd-fg);letter-spacing:.02em;}
.kpi .kSub{font-size:11px;color:#7d8ea3;margin-top:4px;}
.kpi.alert .kVal{color:#ff8a70;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:18px;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.panel-head h3{margin:0;font-size:14.5px;font-weight:800;}
.panel-body{padding:16px 18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:900px){.grid2{grid-template-columns:1fr;}}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;font-weight:700;
}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:var(--panel-2);}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);}
.tag.origin-china{color:#b8382a;}
.tag.origin-india{color:#1c7a3f;}
.tag.low{background:rgba(184,56,42,.12);color:var(--danger);border-color:transparent;}
.tag.ok{background:rgba(47,143,82,.12);color:var(--success);border-color:transparent;}
.tag.due{background:rgba(185,130,28,.14);color:var(--warn);border-color:transparent;}
.rowActions{display:flex;gap:6px;}

.formGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.tblFoot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);}
.pager{display:flex;gap:4px;}
.pager button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:12px;}
.pager button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800;}

.filterBar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filterBar select, .filterBar input{
  padding:8px 10px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:12.5px;
}

/* ---------- MODAL ---------- */
.modalOverlay{
  position:fixed;inset:0;background:rgba(15,18,24,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modalOverlay.show{display:flex;}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.modal.wide{max-width:900px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:15px;font-weight:800;}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.closeX{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;}

/* ---------- TOAST ---------- */
#toastWrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--steel-dk);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.3);min-width:220px;border-left:4px solid var(--accent);
  animation:slideIn .18s ease-out;
}
.toast.success{border-left-color:var(--success);}
.toast.error{border-left-color:var(--danger);}
@keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- BILLING ---------- */
.billGrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media (max-width:1000px){.billGrid{grid-template-columns:1fr;}}
.cartRow{display:grid;grid-template-columns:2fr 60px 90px 90px 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.cartRow input[type=number]{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);}
.totalsBox{background:var(--panel-2);border-radius:10px;padding:14px 16px;margin-top:10px;}
.totalsBox .tRow{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;}
.totalsBox .tRow.grand{font-size:18px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;}
.badge-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}

/* ---------- PRINT INVOICE ---------- */
.printSheet{display:none;}
@media print{
  body *{visibility:hidden;}
  .printSheet, .printSheet *{visibility:visible;}
  .printSheet{display:block;position:absolute;top:0;left:0;width:100%;padding:20px;}
}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state svg{width:40px;height:40px;opacity:.4;margin-bottom:10px;}

.chartBox{height:260px;position:relative;}
label.chk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer;}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0;}
.small-muted{font-size:11.5px;color:var(--muted);}
</style>
</head>
<body data-theme="light">

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="loginCard">
    <div class="logoRow">
      <div class="logo-mark" style="width:56px;height:56px;border-radius:14px;">
        <svg viewBox="0 0 24 24" fill="none" style="width:32px;height:32px;"><circle cx="12" cy="12" r="9" stroke="#d4af37" stroke-width="1.6"/><path d="M12 7v5l3.5 2" stroke="#d4af37" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3v1.4M12 19.6V21M21 12h-1.4M4.4 12H3" stroke="#d4af37" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
      <h1>Unique Suppliers</h1>
      <p class="sub">Weighing &amp; Kitchen Machinery — Bharatpur-3, Narayanghad, Chitwan</p>
    </div>
    <form id="loginForm">
      <div class="field"><label>User ID</label><input id="loginId" type="text" autocomplete="username" placeholder="Enter user ID"></div>
      <div class="field">
        <label>Password</label>
        <div class="pwWrap">
          <input id="loginPw" type="password" autocomplete="current-password" placeholder="Enter password">
          <button type="button" class="pwToggle" id="togglePw" tabindex="-1" aria-label="Show password">
            <svg id="togglePwIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="loginSubmitBtn">Sign in</button>
      <div class="loginErr" id="loginErr"></div>
    </form>
    <div class="loginHint">Default login — ID: <b>unique123</b> · Password: <b>admin</b></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#f0a840" stroke-width="1.6"/><path d="M12 7v5l3.5 2" stroke="#f0a840" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3v1.4M12 19.6V21M21 12h-1.4M4.4 12H3" stroke="#f0a840" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      <div class="logo-text"><b>Unique Suppliers</b><span>Narayangadh</span></div>
    </div>
    <div id="navList"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="pageTitle" id="pageTitle">Dashboard</div>
      <div class="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearch" placeholder="Search products, invoices, customers...">
        <div class="searchResults" id="searchResults"></div>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" id="themeBtn" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

/* ================= PERSISTENCE ================= */
async function loadDB(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      DB = JSON.parse(res.value);
      // migrations / safety defaults
      DB.expenses = DB.expenses || [];
      DB.bankAccounts = DB.bankAccounts || [];
      DB.bankTx = DB.bankTx || [];
      delete DB.bankbook;
      DB.capital = DB.capital || {amount:0,history:[]};
      DB.suppliers = DB.suppliers || [];
      DB.employees = DB.employees || [];
      DB.auditlog = DB.auditlog || [];
      return;
    }
  }catch(e){ /* key not found -> seed */ }
  DB = seedDB();
  await persist(true);
}
function persist(immediate=false){
  clearTimeout(saveTimer);
  const doSave = async ()=>{
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(DB), false);
    }catch(e){
      toast('Backup save failed — will retry.', 'error');
    }
  };
  if(immediate) return doSave();
  saveTimer = setTimeout(doSave, 400);
}
/** Transaction wrapper: clones DB, runs fn, rolls back to snapshot on error */
function runTx(fn, successMsg){
  const snapshot = JSON.stringify(DB);
  try{
    fn();
    persist();
    if(successMsg) toast(successMsg, 'success');
    return true;
  }catch(err){
    DB = JSON.parse(snapshot);
    console.error(err);
    toast('Transaction failed — changes rolled back.', 'error');
    return false;
  }
}

function buildNav(){
  const wrap = document.getElementById('navList');
  wrap.innerHTML = NAV.map(item=>{
    if(item.group) return `<div class="navgroup">${item.group}</div>`;
    let badge = '';
    if(item.id==='products'){
      const low = DB.products.filter(p=>!p.deleted && p.stock<=p.minStock).length;
      if(low>0) badge = `<span class="navbadge">${low}</span>`;
    }
    if(item.id==='invoices'){
      const due = DB.invoices.filter(i=>!i.deleted && i.due>0).length;
      if(due>0) badge = `<span class="navbadge">${due}</span>`;
    }
    return `<div class="navitem" data-nav="${item.id}">${ic(item.icon)}<span>${item.label}</span>${badge}</div>`;
  }).join('');
  wrap.querySelectorAll('.navitem').forEach(el=>{
    el.addEventListener('click', ()=> goto(el.dataset.nav));
  });
}
function goto(id){
  CUR = id;
  document.querySelectorAll('.navitem').forEach(el=> el.classList.toggle('active', el.dataset.nav===id));

function downloadBackup(){

  const a = document.createElement('a');
  a.href = url; a.download = `unique-suppliers-backup-${todayStr()}.json`;

  audit('Backup', 'Database exported');

}
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.products || !parsed.invoices) throw new Error('Invalid file');
      DB = parsed;
      audit('Restore', 'Database restored from backup file');
      persist(true);
      toast('Backup restored successfully.', 'success');
      buildNav(); render();
      closeModal();
    }catch(err){ toast('Invalid backup file.', 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function billFilterProducts(q){
  q = q.toLowerCase();
  return DB.products.filter(p=>!p.deleted && (p.name+' '+p.company+' '+p.category+' '+p.variant).toLowerCase().includes(q)).slice(0,8);
}
function recalcBillTotals(){
  const subtotal = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const vatOn = document.getElementById('billVat')?.checked;
  const vat = vatOn ? subtotal*VAT_RATE : 0;
  const total = subtotal + vat;
  const paidInput = document.getElementById('billPaid');
  let paid = paidInput ? Number(paidInput.value)||0 : 0;
  if(paid>total) paid = total;
  const due = Math.max(total-paid,0);
  document.getElementById('sumSubtotal').textContent = fmt(subtotal);
  document.getElementById('sumVat').textContent = fmt(vat);
  document.getElementById('sumTotal').textContent = fmt(total);
  document.getElementById('sumPaid').textContent = fmt(paid);
  document.getElementById('sumDue').textContent = fmt(due);
  return {subtotal, vat, total, paid, due};
}
function initBillingEvents(){
  const search = document.getElementById('billSearch');
  const results = document.getElementById('billSearchResults');
  search.addEventListener('input', ()=>{
    const q = search.value.trim();
    if(!q){ results.classList.remove('show'); return; }
    const matches = billFilterProducts(q);
    results.innerHTML = matches.length ? matches.map(p=>`
      <div class="sr-item" data-pid="${p.id}"><span class="sr-tag">${esc(p.category)} · Stock ${p.stock}</span><br>${esc(p.company)} ${esc(p.name)} ${esc(p.variant)} — ${fmt(p.price)}</div>
    `).join('') : '<div class="sr-item">No matching products.</div>';
    results.classList.add('show');
    results.querySelectorAll('[data-pid]').forEach(el=> el.addEventListener('click', ()=>{
      addToCart(el.dataset.pid); search.value=''; results.classList.remove('show');
    }));
  });
  document.addEventListener('click', (e)=>{ if(!e.target.closest('#billSearch') && !e.target.closest('#billSearchResults')) results.classList.remove('show'); }, {once:false});

  document.querySelectorAll('.qtyInput').forEach(inp=> inp.addEventListener('input', ()=>{
    const idx = +inp.dataset.idx; let v = Math.max(1, Math.min(Number(inp.value)||1, cart[idx].stock));
    cart[idx].qty = v; recalcBillTotals();
  }));
  document.querySelectorAll('.priceInput').forEach(inp=> inp.addEventListener('input', ()=>{
    const idx = +inp.dataset.idx; cart[idx].price = Math.max(0, Number(inp.value)||0); recalcBillTotals();
  }));
  document.querySelectorAll('[data-remove]').forEach(btn=> btn.addEventListener('click', ()=>{
    cart.splice(+btn.dataset.remove,1); render();
  }));
  document.getElementById('billVat').addEventListener('change', recalcBillTotals);
  document.getElementById('billPaid').addEventListener('input', recalcBillTotals);
  document.getElementById('newCustBtn').addEventListener('click', openNewCustomerModal);
  document.getElementById('genInvoiceBtn').addEventListener('click', generateInvoice);
  recalcBillTotals();
}
function addToCart(pid){
  const p = DB.products.find(x=>x.id===pid);
  if(!p) return;
  if(p.stock<=0){ toast('This product is out of stock.', 'error'); return; }
  const existing = cart.find(c=>c.productId===pid);
  if(existing){ if(existing.qty<p.stock) existing.qty++; else toast('No more stock available.', 'error'); }
  else cart.push({productId:p.id, name:p.name, company:p.company, variant:p.variant, price:p.price, qty:1, stock:p.stock});
  render();
}

function saveNewCustomer(){
  const name = document.getElementById('ncName').value.trim();
  if(!name){ toast('Customer name is required.', 'error'); return; }
  runTx(()=>{
    DB.customers.push({id:uid(), name, phone:document.getElementById('ncPhone').value.trim()||'-', address:document.getElementById('ncAddr').value.trim()||'-', due:0, deleted:false});

function generateInvoice(){
  if(cart.length===0){ toast('Add at least one product to the bill.', 'error'); return; }
  const custId = document.getElementById('billCustomer').value;
  const cust = DB.customers.find(c=>c.id===custId);
  if(!cust){ toast('Please select a valid customer.', 'error'); return; }
  const method = document.getElementById('billPayMethod').value;
  const totals = recalcBillTotals();

  const ok = runTx(()=>{
    for(const item of cart){
      const p = DB.products.find(pp=>pp.id===item.productId);
      if(!p || p.stock < item.qty) throw new Error('Insufficient stock for '+item.name);
    }
    const no = 'INV-' + String(DB.counters.invoice).padStart(5,'0');
    DB.counters.invoice++;
    const invoice = {
      id: uid(), no, date: todayStr(), time: nowStr(),
      customerId: cust.id, customerName: cust.name,
      items: cart.map(c=>({productId:c.productId, name:`${c.company} ${c.name} ${c.variant}`.trim(), qty:c.qty, price:c.price, total:c.price*c.qty})),
      subtotal: totals.subtotal, vat: totals.vat, total: totals.total,
      paid: totals.paid, due: totals.due, paymentMethod: method, deleted:false
    };
    DB.invoices.unshift(invoice);
    cart.forEach(c=>{ const p = DB.products.find(pp=>pp.id===c.productId); p.stock -= c.qty; });
    if(totals.due>0) cust.due = (cust.due||0) + totals.due;
    if(totals.paid>0){
      DB.cashbook.unshift({id:uid(), date:todayStr(), type:'in', desc:`Sale ${no} — ${cust.name}`, amount:totals.paid, method, ref:no});
    }
    audit('Invoice Created', `${no} — ${cust.name} — ${fmt(totals.total)}`);
    printData = buildPrintable(invoice);
    cart = [];
  });
  if(ok){
    toast('Invoice generated successfully.', 'success');
    printInvoiceNow();
    goto('invoices');
  }
}

function softDeleteInvoice(id){
  if(!confirm('Move this invoice to trash? It will be excluded from reports but kept in records (soft delete).')) return;
  runTx(()=>{
    const inv = DB.invoices.find(i=>i.id===id);
    inv.deleted = true;
    const cust = DB.customers.find(c=>c.id===inv.customerId);
    if(cust && inv.due>0) cust.due = Math.max(0, cust.due - inv.due);
    audit('Invoice Deleted (soft)', inv.no);
  }, 'Invoice moved to trash.');
  render();
}

    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="settleInvoice('${id}')">Record Payment</button></div>`);
}
function settleInvoice(id){
  const amt = Number(document.getElementById('settleAmt').value)||0;
  const method = document.getElementById('settleMethod').value;
  if(amt<=0){ toast('Enter a valid amount.', 'error'); return; }
  runTx(()=>{
    const inv = DB.invoices.find(i=>i.id===id);
    const pay = Math.min(amt, inv.due);
    inv.paid += pay; inv.due -= pay;
    const cust = DB.customers.find(c=>c.id===inv.customerId);
    if(cust) cust.due = Math.max(0, cust.due - pay);
    DB.cashbook.unshift({id:uid(), date:todayStr(), type:'in', desc:`Payment received ${inv.no} — ${inv.customerName}`, amount:pay, method, ref:inv.no});
    audit('Payment Received', `${inv.no} — ${fmt(pay)}`);
  }, 'Payment recorded.');
  closeModal(); render();
}

function saveProduct(id){
  const category = document.getElementById('pfCategory').value;
  const company = document.getElementById('pfCompany').value.trim();
  const name = document.getElementById('pfName').value.trim();
  const variant = document.getElementById('pfVariant').value.trim() || '-';
  const origin = document.getElementById('pfOrigin').value;
  const price = Number(document.getElementById('pfPrice').value);
  const stock = Number(document.getElementById('pfStock').value);
  const minStock = Number(document.getElementById('pfMin').value)||3;
  if(!company || !name || !(price>=0) || isNaN(stock)){ toast('Please fill all required fields correctly.', 'error'); return; }
  runTx(()=>{
    if(id){
      const p = DB.products.find(x=>x.id===id);
      Object.assign(p, {category, company, name, variant, origin, price, stock, minStock});
      audit('Product Updated', `${company} ${name} ${variant}`);
    } else {
      DB.products.push({id:uid(), category, company, name, variant, origin, price, stock, minStock, deleted:false});
      audit('Product Added', `${company} ${name} ${variant}`);

  }, id?'Product updated.':'Product added.');
  closeModal(); render();

function saveBankAccount(){

  const opening = Number(document.getElementById('bkOpening').value)||0;

    DB.bankAccounts = DB.bankAccounts.filter(x=>x.id!==id);

  const acc = DB.bankAccounts.find(a=>a.id===accountId);
  openModal(`

function saveBankTx(accountId, type){
  const amount = Number(document.getElementById('bkTxAmt').value);
  const desc = document.getElementById('bkTxDesc').value.trim() || (type==='deposit'?'Deposit':'Withdrawal');
  if(!(amount>0)){ toast('Enter a valid amount.', 'error'); return; }
  const ok = runTx(()=>{
    const acc = DB.bankAccounts.find(a=>a.id===accountId);
    if(type==='withdraw' && amount>acc.balance) throw new Error('Insufficient bank balance');
    acc.balance += (type==='deposit'? amount : -amount);
    DB.bankTx.unshift({id:uid(), accountId, date:todayStr(), type, desc, amount});
    if(type==='withdraw') DB.expenses.push({id:uid(), date:todayStr(), desc:`${acc.bankName} — ${desc}`, amount, category:'banking'});
    audit('Banking Transaction', `${acc.bankName} — ${type} — ${fmt(amount)}`);
  }, 'Transaction recorded.');
  if(ok){ closeModal(); render(); }
}

  <div class="panel">
    <div class="panel-head"><h3>Employees & Mechanics</h3><button class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="openEmployeeModal()">+ Add Employee</button></div>
    <table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Monthly Salary</th><th>Attendance (last 5)</th><th>Actions</th></tr></thead>
    <tbody>${list.length? list.map(e=>`<tr>
      <td><b>${esc(e.name)}</b></td><td>${esc(e.role)}</td><td>${esc(e.phone)}</td><td class="mono">${fmt(e.salary)}</td>
      <td>${(e.attendance||[]).slice(-5).map(a=>`<span class="tag ${a.status==='Present'?'ok':a.status==='Absent'?'low':'due'}" style="margin-right:2px;">${a.date.slice(5)}:${a.status[0]}</span>`).join('') || '-'}</td>
      <td class="rowActions"><button class="btn btn-sm btn-outline" onclick="markAttendance('${e.id}')">Mark Attendance</button><button class="btn btn-sm btn-ghost" style="color:var(--danger);" onclick="softDeleteEmployee('${e.id}')">Remove</button></td>
    </tr>`).join('') : '<tr><td colspan="6" class="small-muted" style="text-align:center;padding:20px;">No employees added yet.</td></tr>'}</tbody></table>
    <div class="tblFoot"><span>${list.length} employee(s)</span></div>
  </div>`;
}
function initEmployeeEvents(){}
function openEmployeeModal(){
  openModal(`
    <div class="modal-head"><h3>Add Employee</h3><button class="closeX" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="formGrid">
        <div class="field"><label>Name *</label><input id="empName"></div>
        <div class="field"><label>Role</label><input id="empRole" placeholder="e.g. Mechanic, Sales Staff"></div>
        <div class="field"><label>Phone</label><input id="empPhone"></div>
        <div class="field"><label>Monthly Salary</label><input id="empSalary" type="number" class="mono"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEmployee()">Save</button></div>`);
}
function saveEmployee(){
  const name = document.getElementById('empName').value.trim();
  if(!name){ toast('Employee name required.', 'error'); return; }
  runTx(()=>{
    DB.employees.push({id:uid(), name, role:document.getElementById('empRole').value.trim()||'Staff', phone:document.getElementById('empPhone').value.trim()||'-', salary:Number(document.getElementById('empSalary').value)||0, attendance:[], deleted:false});
    audit('Employee Added', name);
  }, 'Employee added.');
  closeModal(); render();
}
function softDeleteEmployee(id){
  if(!confirm('Remove this employee record?')) return;
  runTx(()=>{ DB.employees.find(e=>e.id===id).deleted=true; audit('Employee Removed', id); }, 'Employee removed.');
  render();
}
function markAttendance(id){
  openModal(`
    <div class="modal-head"><h3>Mark Attendance</h3><button class="closeX" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Date</label><input id="attDate" type="date" value="${todayStr()}"></div>
      <div class="field"><label>Status</label><select id="attStatus"><option>Present</option><option>Absent</option><option>Half Day</option><option>Leave</option></select></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAttendance('${id}')">Save</button></div>`);
}
function saveAttendance(id){
  const date = document.getElementById('attDate').value || todayStr();
  const status = document.getElementById('attStatus').value;
  runTx(()=>{
    const e = DB.employees.find(x=>x.id===id);
    e.attendance = e.attendance || [];
    e.attendance = e.attendance.filter(a=>a.date!==date);
    e.attendance.push({date, status});
    audit('Attendance Marked', `${e.name} — ${date} — ${status}`);
  }, 'Attendance saved.');
  closeModal(); render();
}

/* ================= REPORTS ================= */
function renderReports(){
  const invoices = DB.invoices.filter(i=>!i.deleted);
  const totalSales = invoices.reduce((s,i)=>s+i.total,0);
  const totalVat = invoices.reduce((s,i)=>s+i.vat,0);
  const totalExpense = DB.expenses.reduce((s,e)=>s+e.amount,0);
  const purchaseEstimate = totalExpense;
  const profit = totalSales - totalVat - purchaseEstimate;
  const lowStock = DB.products.filter(p=>!p.deleted && p.stock<=p.minStock);
  const overdue = DB.customers.filter(c=>!c.deleted && c.due>0);
  const pending = invoices.filter(i=>i.due>0);
  const dailySales = invoices.filter(i=>i.date===todayStr()).reduce((s,i)=>s+i.total,0);
  const dailyExp = DB.expenses.filter(e=>e.date===todayStr()).reduce((s,e)=>s+e.amount,0);

  return `
  <div class="kpiRow">
    <div class="kpi"><div class="kLabel">Total Sales</div><div class="kVal mono">${fmt(totalSales)}</div></div>
    <div class="kpi"><div class="kLabel">Total VAT Collected</div><div class="kVal mono">${fmt(totalVat)}</div></div>
    <div class="kpi alert"><div class="kLabel">Total Expenses</div><div class="kVal mono">${fmt(totalExpense)}</div></div>
    <div class="kpi"><div class="kLabel">Net Profit / Loss</div><div class="kVal mono" style="color:${profit>=0?'var(--lcd-fg)':'#ff8a70'};">${fmt(profit)}</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><h3>Daily Summary — ${todayStr()}</h3></div>
      <div class="panel-body">
        <div class="tRow" style="display:flex;justify-content:space-between;padding:6px 0;">Sales<span class="mono">${fmt(dailySales)}</span></div>
        <div class="tRow" style="display:flex;justify-content:space-between;padding:6px 0;">Expenses<span class="mono">${fmt(dailyExp)}</span></div>
        <div class="tRow" style="display:flex;justify-content:space-between;padding:6px 0;font-weight:800;border-top:1px dashed var(--line);">Net<span class="mono">${fmt(dailySales-dailyExp)}</span></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Pending Payments</h3></div>
      <table><thead><tr><th>Invoice</th><th>Customer</th><th>Due</th></tr></thead>
      <tbody>${pending.length? pending.slice(0,8).map(i=>`<tr><td class="mono">${esc(i.no)}</td><td>${esc(i.customerName)}</td><td class="mono">${fmt(i.due)}</td></tr>`).join(''):'<tr><td colspan="3" class="small-muted" style="text-align:center;padding:16px;">None pending.</td></tr>'}</tbody></table>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><h3>Customer Overdue</h3></div>
      <table><thead><tr><th>Customer</th><th>Phone</th><th>Due</th></tr></thead>
      <tbody>${overdue.length? overdue.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td class="mono">${fmt(c.due)}</td></tr>`).join(''):'<tr><td colspan="3" class="small-muted" style="text-align:center;padding:16px;">No overdue customers.</td></tr>'}</tbody></table>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Low Stock</h3></div>
      <table><thead><tr><th>Product</th><th>Stock</th><th>Reorder At</th></tr></thead>
      <tbody>${lowStock.length? lowStock.map(p=>`<tr><td>${esc(p.company)} ${esc(p.name)} ${esc(p.variant)}</td><td class="mono">${p.stock}</td><td class="mono">${p.minStock}</td></tr>`).join(''):'<tr><td colspan="3" class="small-muted" style="text-align:center;padding:16px;">Stock is healthy.</td></tr>'}</tbody></table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Purchase / Expense Log</h3></div>
    <table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead>
    <tbody>${DB.expenses.length? DB.expenses.slice(-15).reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.desc)}</td><td>${esc(e.category)}</td><td class="mono">${fmt(e.amount)}</td></tr>`).join(''):'<tr><td colspan="4" class="small-muted" style="text-align:center;padding:16px;">No expense entries yet.</td></tr>'}</tbody></table>
  </div>`;
}

/* ================= AUDIT LOG ================= */
function renderAuditLog(){
  return `
  <div class="panel">
    <div class="panel-head"><h3>Audit Log</h3></div>
    <table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
    <tbody>${DB.auditlog.length? DB.auditlog.slice(0,100).map(a=>`<tr><td class="mono">${esc(a.ts)}</td><td>${esc(a.user)}</td><td><span class="tag">${esc(a.action)}</span></td><td>${esc(a.details)}</td></tr>`).join(''):'<tr><td colspan="4" class="small-muted" style="text-align:center;padding:20px;">No activity recorded yet.</td></tr>'}</tbody></table>
  </div>`;
}

/* ================= SETTINGS ================= */
function renderSettings(){
  return `
  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><h3>Company Information</h3></div>
      <div class="panel-body">
        <div class="field"><label>Company Name</label><input value="${esc(COMPANY_INFO.name)}" disabled></div>
        <div class="field"><label>Location</label><input value="${esc(COMPANY_INFO.address)}" disabled></div>
        <div class="field"><label>Phone Numbers</label><input value="${COMPANY_INFO.phones.join(', ')}" disabled></div>
        <div class="field"><label>PAN Number</label><input value="${esc(COMPANY_INFO.pan)}" disabled></div>
        <div class="field"><label>Currency</label><input value="NPR (Nepali Rupees)" disabled></div>
        <div class="field"><label>VAT Rate</label><input value="13% — Nepal VAT System" disabled></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Preferences</h3></div>
      <div class="panel-body">
        <label class="chk" style="margin-bottom:12px;"><input type="checkbox" id="setVatDefault" ${DB.settings.vatDefault?'checked':''}> Apply VAT by default on new bills</label>
        <div class="field"><label>Theme</label>
          <select id="setTheme"><option value="light" ${DB.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${DB.settings.theme==='dark'?'selected':''}>Dark</option></select>
        </div>
        <hr class="sep">
        <p class="small-muted">Data is stored securely and never permanently deleted — removed records are soft-deleted and remain in the audit trail. Use the backup icon in the top bar to export or restore your full database.</p>
      </div>
    </div>
  </div>`;
}
function initSettingsEvents(){
  document.getElementById('setVatDefault').addEventListener('change', (e)=>{ DB.settings.vatDefault = e.target.checked; persist(); toast('Preference saved.', 'success'); });
  document.getElementById('setTheme').addEventListener('change', (e)=>{
    DB.settings.theme = e.target.value;
    document.body.setAttribute('data-theme', e.target.value);
    document.documentElement.setAttribute('data-theme', e.target.value);
    persist(); toast('Theme updated.', 'success');
  });
}

/* ================= BOOT ================= */
(async function boot(){
  // Nothing loads until login for privacy; DB is loaded at login time.
})();
</script>
</body>
</html>
